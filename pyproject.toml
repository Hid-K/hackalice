[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackalice"
version = "0.3.0"
description = "Root + постоянный SSH для Яндекс Станций (инструмент для СВОИХ устройств)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
hackalice = "hackalice.cli:main"

[tool.setuptools]
packages = ["hackalice"]
